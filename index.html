<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speaking Club 圖文有聲口說講稿（Firestore 雲端保護版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="text-slate-800 pb-20">

  <!-- 頂部工具列（精簡貼齊版面） -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-2xs">
    <div class="max-w-4xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📄</span>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold text-slate-800 leading-tight">英文口說有聲講義</h1>
            <span id="cloudStatus" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">
              ⏳ 連線中...
            </span>
          </div>
          <p class="text-[11px] text-slate-500">反白單字查英漢字典 • 填空自動翻譯 • 雲端同步</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1.5">
        <!-- 雲端講稿選擇器 -->
        <div class="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-lg px-2 py-1.5">
          <span class="text-xs font-bold text-slate-700 shrink-0">📚 講稿：</span>
          <select id="savedScriptsSelect" onchange="loadSelectedScript(this.value)" class="text-xs bg-transparent font-medium text-slate-900 focus:outline-none max-w-[145px]">
            <option value="default">預設範例 (11/13)</option>
          </select>
          <button id="deleteCloudBtn" onclick="deleteCurrentCloudScript()" class="hidden text-xs text-rose-500 hover:text-rose-700 px-1 font-bold" title="刪除此雲端講稿（需管理密碼）">
            🗑️
          </button>
        </div>

        <!-- 語調選擇 -->
        <div class="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-lg px-2 py-1.5">
          <span class="text-xs font-bold text-slate-700 shrink-0">🗣️ 語調：</span>
          <select id="voiceSelect" onchange="handleVoiceChange(this.value)" class="text-xs bg-white border border-slate-200 rounded px-1.5 py-0.5 text-slate-700 font-medium focus:outline-none focus:border-sky-400 max-w-[155px]">
            <option value="">載入中...</option>
          </select>
        </div>

        <!-- 連續播放 -->
        <button id="playAllBtn" onclick="togglePlayAll()" class="flex items-center gap-1 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold text-xs px-2.5 py-1.5 rounded-lg transition">
          <span>▶️</span> 連續播放
        </button>

        <!-- 匯入 PDF -->
        <label class="flex items-center gap-1 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg cursor-pointer transition">
          <span>📄</span> 匯入 PDF
          <input type="file" id="pdfUpload" accept="application/pdf" class="hidden" onchange="handlePdfUpload(event)" />
        </label>

        <!-- 一鍵補齊中文翻譯 -->
        <button id="translateBtn" onclick="triggerManualTranslate()" class="flex items-center gap-1 bg-slate-700 hover:bg-slate-800 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg transition" title="自動為缺少中文註解或已填入單字的句子補齊翻譯">
          <span>🌐</span> 補齊翻譯
        </button>

        <!-- 儲存至 Firestore -->
        <button id="saveCloudBtn" onclick="saveScriptToFirestore()" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg transition">
          <span>☁️</span> 儲存雲端
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區：模擬原始 PDF 紙張文件排版 -->
  <main class="max-w-4xl mx-auto px-3 sm:px-6 mt-6">
    <!-- 狀態提示列 -->
    <div id="statusToast" class="hidden mb-4 bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-2.5 rounded-lg text-sm flex items-center justify-between">
      <span id="statusToastMsg" class="font-medium">✅ 操作完成</span>
      <button onclick="this.parentElement.classList.add('hidden')" class="text-current opacity-70 hover:opacity-100 font-bold ml-3">✕</button>
    </div>

    <!-- 類 PDF 白紙講義容器 -->
    <article class="pdf-paper bg-white border border-slate-200/90 shadow-sm rounded-xl px-6 py-8 sm:px-12 sm:py-10">
      <!-- 文件標題區（貼近 PDF 頂部標題與連結） -->
      <header id="bannerCard" class="pb-5 mb-7 border-b-2 border-slate-800"></header>

      <!-- 講稿段落區（貼近 PDF 條列與段落順序） -->
      <div id="scriptContainer" class="space-y-8"></div>
    </article>
  </main>

  <!-- 選取文字時出現的可愛浮動查字典小按鈕 -->
  <button
    id="selectionDictTooltip"
    type="button"
    class="hidden fixed z-40 items-center gap-1.5 px-3.5 py-2 rounded-full bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-amber-950 font-bold text-xs shadow-lg border-2 border-white cursor-pointer transition-transform hover:scale-105"
  >
    <span class="text-sm">📖</span>
    <span id="selectionDictLabel">查英漢字典</span>
  </button>

  <!-- 可愛英漢字典小對話框 -->
  <div id="dictModal" class="hidden fixed inset-0 z-50 bg-slate-900/45 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="dict-pop bg-white rounded-3xl shadow-2xl border-4 border-amber-200 max-w-md w-full overflow-hidden flex flex-col max-h-[85vh]">
      <div class="bg-gradient-to-r from-amber-300 via-yellow-200 to-sky-200 px-5 py-3.5 flex items-center justify-between border-b-2 border-amber-200">
        <div class="flex items-center gap-2">
          <span class="text-2xl">🦉</span>
          <div>
            <h3 class="text-base font-bold text-amber-950 leading-tight">英漢小字典</h3>
            <p class="text-[11px] text-amber-800/80">English-Chinese Dictionary</p>
          </div>
        </div>
        <button
          id="closeDictModalBtn"
          type="button"
          class="w-8 h-8 rounded-full bg-white/80 hover:bg-white text-slate-600 hover:text-rose-600 font-bold text-sm flex items-center justify-center shadow-xs transition"
          title="關閉小字典 (Esc)"
        >
          ✕
        </button>
      </div>

      <div class="px-5 pt-3.5 pb-2.5 bg-amber-50/50 border-b border-amber-100">
        <form id="dictSearchForm" class="flex items-center gap-2">
          <input
            type="text"
            id="dictSearchInput"
            placeholder="輸入想查詢的英文單字..."
            autocomplete="off"
            class="en-font flex-1 px-3.5 py-2 text-base font-bold text-slate-800 bg-white border-2 border-amber-200 rounded-2xl focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100"
          />
          <button
            type="submit"
            class="px-4 py-2 bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold rounded-2xl shadow-xs transition shrink-0"
          >
            🔍 查詢
          </button>
        </form>
      </div>

      <div id="dictResultBody" class="p-5 overflow-y-auto space-y-3.5 text-sm"></div>
    </div>
  </div>

  <!-- 管理員密碼驗證彈窗 -->
  <div id="adminAuthModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-sm w-full p-6">
      <div class="flex items-center gap-2.5 mb-2">
        <span class="text-2xl">🔐</span>
        <h3 class="text-lg font-bold text-slate-800">管理員權限驗證</h3>
      </div>
      <p id="adminAuthDesc" class="text-xs text-slate-500 mb-4">
        為避免資料遭到更動，請輸入管理員密碼以繼續操作：
      </p>
      <input
        type="password"
        id="adminPasswordInput"
        placeholder="請輸入管理密碼"
        autocomplete="off"
        class="w-full px-3.5 py-2.5 text-center text-lg tracking-widest font-bold border border-slate-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 mb-4"
      />
      <div class="flex items-center justify-end gap-2">
        <button id="adminCancelBtn" type="button" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
          取消
        </button>
        <button id="adminConfirmBtn" type="button" class="px-4 py-2 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow-sm transition">
          確認送出
        </button>
      </div>
    </div>
  </div>

  <!-- 密碼錯誤／操作失敗明確警示彈窗 -->
  <div id="errorAlertModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border-2 border-rose-300 max-w-sm w-full p-6">
      <div class="flex items-center gap-2.5 mb-3">
        <span class="text-3xl">❌</span>
        <h3 id="errorAlertTitle" class="text-lg font-bold text-rose-700">密碼錯誤，沒有儲存成功</h3>
      </div>
      <p id="errorAlertMsg" class="text-sm text-slate-700 leading-relaxed mb-5">
        您輸入的管理員密碼不正確，雲端已拒絕寫入，本次講稿<strong>沒有儲存成功</strong>。請確認密碼後重新嘗試。
      </p>
      <div class="flex items-center justify-end gap-2">
        <button id="errorCloseBtn" type="button" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
          我知道了
        </button>
        <button id="errorRetryBtn" type="button" class="px-4 py-2 text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-lg shadow-sm transition">
          🔄 重新輸入密碼
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
