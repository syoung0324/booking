<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speaking Club 圖文有聲口說講稿（Firestore 雲端保護版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="text-slate-800 pb-16">

  <!-- 頂部控制列 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-sky-100 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2.5">
      <div class="flex items-center gap-2.5">
        <span class="text-3xl">🎙️</span>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold text-sky-900 leading-tight">英文口說圖文有聲講稿</h1>
            <span id="cloudStatus" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">
              ⏳ 連線雲端中...
            </span>
          </div>
          <p class="text-xs text-slate-500">PDF 匯入自動中譯 • 可調式語速 • Firestore 同步</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <!-- 雲端講稿選擇器 -->
        <div class="flex items-center gap-1 bg-indigo-50 border border-indigo-200 rounded-lg px-2 py-1.5">
          <span class="text-xs font-bold text-indigo-700 shrink-0">📚 講稿庫：</span>
          <select id="savedScriptsSelect" onchange="loadSelectedScript(this.value)" class="text-xs bg-transparent font-medium text-indigo-900 focus:outline-none max-w-[150px]">
            <option value="default">預設範例 (11/13)</option>
          </select>
          <button id="deleteCloudBtn" onclick="deleteCurrentCloudScript()" class="hidden text-xs text-rose-500 hover:text-rose-700 px-1 font-bold" title="刪除此雲端講稿（需管理密碼）">
            🗑️
          </button>
        </div>

        <!-- 語調選擇 -->
        <div class="flex items-center gap-1.5 bg-sky-50/80 border border-sky-200 rounded-lg px-2.5 py-1.5">
          <div class="flex flex-col leading-none shrink-0">
            <span class="text-xs font-bold text-sky-900">🗣️ 語調</span>
            <span class="text-[10px] text-sky-600 mt-0.5">(可選不同的語調)</span>
          </div>
          <select id="voiceSelect" onchange="handleVoiceChange(this.value)" class="text-xs bg-white border border-sky-200 rounded-md px-2 py-1 text-slate-700 font-medium focus:outline-none focus:border-sky-400 max-w-[165px]">
            <option value="">載入語調中...</option>
          </select>
        </div>

        <!-- 全域語速調整滑桿 -->
        <div class="flex items-center gap-1.5 bg-slate-100 border border-slate-200 rounded-lg px-2.5 py-1.5" title="調整標準播放與連續播放的語速">
          <span class="text-xs font-bold text-slate-600">🎚️ 語速</span>
          <input
            type="range"
            id="globalRateSlider"
            min="0.5"
            max="1.5"
            step="0.05"
            value="1.0"
            oninput="updateGlobalRate(this.value)"
            class="w-16 accent-sky-600 cursor-pointer"
          />
          <span id="globalRateLabel" class="text-xs font-mono font-bold text-sky-700 w-9 text-right">1.0x</span>
        </div>

        <!-- 連續播放 -->
        <button id="playAllBtn" onclick="togglePlayAll()" class="flex items-center gap-1 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold text-xs px-3 py-2 rounded-lg shadow-sm transition">
          <span>▶️</span> 連續播放
        </button>

        <!-- 匯入 PDF -->
        <label class="flex items-center gap-1 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs px-3 py-2 rounded-lg shadow-sm cursor-pointer transition">
          <span>📄</span> 匯入 PDF
          <input type="file" id="pdfUpload" accept="application/pdf" class="hidden" onchange="handlePdfUpload(event)" />
        </label>

        <!-- 一鍵補齊中文翻譯 -->
        <button id="translateBtn" onclick="triggerManualTranslate()" class="flex items-center gap-1 bg-violet-600 hover:bg-violet-700 text-white font-bold text-xs px-3 py-2 rounded-lg shadow-sm transition" title="自動為缺少中文註解的句子補齊翻譯">
          <span>🌐</span> 補齊翻譯
        </button>

        <!-- 儲存至 Firestore -->
        <button id="saveCloudBtn" onclick="saveScriptToFirestore()" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3 py-2 rounded-lg shadow-sm transition">
          <span>☁️</span> 儲存至雲端
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-5xl mx-auto px-4 mt-6">
    <!-- 狀態提示列 -->
    <div id="statusToast" class="hidden mb-4 bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl text-sm flex items-center justify-between shadow-sm">
      <span id="statusToastMsg" class="font-medium">✅ 操作完成</span>
      <button onclick="this.parentElement.classList.add('hidden')" class="text-current opacity-70 hover:opacity-100 font-bold ml-3">✕</button>
    </div>

    <!-- 活動資訊橫幅（支援原地行內編輯） -->
    <div id="bannerCard" class="bg-gradient-to-r from-sky-500 to-indigo-600 rounded-2xl p-6 text-white shadow-md mb-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4"></div>

    <!-- 講稿卡片容器 -->
    <div id="scriptContainer" class="space-y-6"></div>
  </main>

  <!-- 管理員密碼驗證彈窗 -->
  <div id="adminAuthModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-sm w-full p-6">
      <div class="flex items-center gap-2.5 mb-2">
        <span class="text-2xl">🔐</span>
        <h3 class="text-lg font-bold text-slate-800">管理員權限驗證</h3>
      </div>
      <p id="adminAuthDesc" class="text-xs text-slate-500 mb-4">
        為避免資料遭到更動，請輸入管理員密碼以繼續操作：
      </p>
      <input
        type="password"
        id="adminPasswordInput"
        placeholder="請輸入管理密碼"
        autocomplete="off"
        class="w-full px-3.5 py-2.5 text-center text-lg tracking-widest font-bold border border-slate-300 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 mb-4"
      />
      <div class="flex items-center justify-end gap-2">
        <button id="adminCancelBtn" type="button" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
          取消
        </button>
        <button id="adminConfirmBtn" type="button" class="px-4 py-2 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow-sm transition">
          確認送出
        </button>
      </div>
    </div>
  </div>

  <!-- 密碼錯誤／操作失敗明確警示彈窗 -->
  <div id="errorAlertModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border-2 border-rose-300 max-w-sm w-full p-6">
      <div class="flex items-center gap-2.5 mb-3">
        <span class="text-3xl">❌</span>
        <h3 id="errorAlertTitle" class="text-lg font-bold text-rose-700">密碼錯誤，沒有儲存成功</h3>
      </div>
      <p id="errorAlertMsg" class="text-sm text-slate-700 leading-relaxed mb-5">
        您輸入的管理員密碼不正確，雲端已拒絕寫入，本次講稿<strong>沒有儲存成功</strong>。請確認密碼後重新嘗試。
      </p>
      <div class="flex items-center justify-end gap-2">
        <button id="errorCloseBtn" type="button" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
          我知道了
        </button>
        <button id="errorRetryBtn" type="button" class="px-4 py-2 text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-lg shadow-sm transition">
          🔄 重新輸入密碼
        </button>
      </div>
    </div>
  </div>

  <!-- 載入外部模組化 JavaScript -->
  <script type="module" src="./app.js"></script>
</body>
</html>
